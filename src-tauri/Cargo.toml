[package]
name = "naive-gui"
version = "0.1.0"
description = "NaïveProxy 桌面配置客户端"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "naive_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "net", "sync", "macros", "rt-multi-thread"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["socks", "rustls-tls-webpki-roots"] }
sysproxy = "0.3"

[profile.release]
strip = true
lto = true
codegen-units = 1
