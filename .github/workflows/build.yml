# 构建流水线:默认分支 / v* tag / 手动触发 —— 产出 NSIS 安装包 + 便携 zip,
# 并发布 GitHub Release:
#   - 默认分支(main)构建 → 滚动更新 `latest` 预发布(下载链接恒定)
#   - 推 v* tag → 正式版 Release(安装包 + 便携包)
#
# 产物:
#   - 安装包:src-tauri/target/release/bundle/nsis/*.exe(Job Artifacts 下载)
#   - 便携包:naive-gui-portable.zip(naive-gui.exe + naive.exe + portable 标记)
#     —— 解压即用,配置存同目录 data/,整个文件夹拷到哪配置跟到哪(DESIGN §6.1)
#
# naive 内核按 NAIVE_VERSION 钉住,从 GitHub Releases 下载
# (src-tauri/resources/bin/naive.exe 已 gitignore,不入库)。
# 提交前注意:src-tauri/Cargo.lock 与 src-tauri/resources/bin/portable 需入库。

name: build

on:
  push:
    branches: [main]   # 若默认分支是 master 请改成 master
    tags: ["v*"]
  workflow_dispatch:   # 可在 Actions 页面手动触发

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # 发布 GitHub Release 需要

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # rustc 需 ≥1.85(依赖链用 edition 2024),stable = 最新
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 1) naive 内核:文件已 gitignore,这里按钉住版本下载到 bundle.resources 源目录
      - name: Download naive.exe
        shell: pwsh
        env:
          NAIVE_VERSION: v150.0.7871.63-1
        run: |
          $ErrorActionPreference = "Stop"
          $binDir = "src-tauri\resources\bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          $zip = "$env:RUNNER_TEMP\naiveproxy-win.zip"
          $url = "https://github.com/klzgrad/naiveproxy/releases/download/$env:NAIVE_VERSION/naiveproxy-$env:NAIVE_VERSION-win-x64.zip"
          Write-Host "下载 naive 内核:$url"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\naiveproxy" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\naiveproxy" -Recurse -Filter naive.exe | Select-Object -First 1
          if (-not $exe) { throw "解压后未找到 naive.exe" }
          Copy-Item $exe.FullName "$binDir\naive.exe" -Force
          Write-Host "naive.exe -> $binDir ($([math]::Round($exe.Length/1MB, 1)) MB)"
          # portable 标记:通常已入库,这里防御性补齐
          if (-not (Test-Path "$binDir\portable")) { New-Item -ItemType File -Path "$binDir\portable" | Out-Null }

      # 2) NSIS 安装包(beforeBuildCommand 会自动先跑 pnpm build 嵌入前端)
      - name: Build NSIS installer
        run: pnpm tauri build

      # 3) 便携 zip:程序 + 内核 + 标记 = 安装目录三件套,解压即用
      - name: Pack portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "release-portable" | Out-Null
          Copy-Item "src-tauri\target\release\naive-gui.exe" "release-portable\"
          Copy-Item "src-tauri\resources\bin\naive.exe" "release-portable\"
          New-Item -ItemType File -Force -Path "release-portable\portable" | Out-Null
          Compress-Archive -Path "release-portable\*" -DestinationPath "naive-gui-portable.zip" -Force
          Get-ChildItem "src-tauri\target\release\bundle\nsis", "naive-gui-portable.zip" | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: naive-gui-win
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            naive-gui-portable.zip
          if-no-files-found: error

      # 4) 发布 Release:
      #    - main/手动触发 → 滚动更新 `latest` 预发布(下载链接恒定,永远是最新构建)
      #    - 推 v* tag → 正式版 Release(生成 release notes)
      - name: Publish rolling release (latest)
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: "Latest build"
          body: "默认分支最新构建(自动发布)。正式版本见 tag 发布。"
          prerelease: true
          allowUpdates: true
          artifacts: |
            src-tauri/target/release/bundle/nsis/*.exe
            naive-gui-portable.zip
          artifactErrorsFailBuild: true

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            naive-gui-portable.zip
          generate_release_notes: true
