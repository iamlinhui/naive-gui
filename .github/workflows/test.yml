# 测试流水线:任何 push / PR 都跑(前端 vitest + Rust 单测)
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # rustc 需 ≥1.85(依赖链用 edition 2024,旧版直接编译失败),stable = 最新
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri-build 在编译期(含 cargo test 的 debug 构建)会校验 bundle.resources
      # 的文件存在;测试任务不下载真内核,放 0 字节占位文件让编译通过
      # (release.yml 会下载真 naive.exe 并覆盖此文件)
      - name: naive.exe placeholder (for cargo test)
        shell: pwsh
        run: |
          $binDir = "src-tauri\resources\bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          if (-not (Test-Path "$binDir\naive.exe")) {
            New-Item -ItemType File -Path "$binDir\naive.exe" | Out-Null
          }

      - name: Frontend tests (vitest)
        run: pnpm test

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
